[package]
name = "sram22"
version = "0.2.0"
edition = "2021"
authors = ["Rahul Kumar <rahulkumar@berkeley.edu>", "Rohan Kumar <rohankumar@berkeley.edu>"]
description = "A configurable SRAM generator"
repository = "https://github.com/rahulk29/sram22"
license = "BSD-3-Clause"

[dependencies]
derive_builder = "0.20"
grid = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
serde_json = "1"
toml = "1"
log = "0.4"
indicatif = "0.18"
console = "0.16"
clap = { version = "4", features = ["derive"] }
itertools = "0.15"
indexmap = { version = "2", features = ["serde"] }
psfparser = { git = "https://github.com/rahulk29/psfparser.git", branch = "master" }
arcstr = "1"
anyhow = "1"
tera = { version = "2", features = ["glob_fs"] }
lazy_static = "1"
colored = "3"
lef21 = { git = "https://github.com/dan-fritchman/Layout21.git", branch = "main" }
plotters = "0.3"
tempfile = "3"

# Substrate dependencies
substrate = { git = "https://github.com/ucb-substrate/substrate", branch = "main" }
subgeom = { git = "https://github.com/ucb-substrate/substrate", branch = "main" }
codegen = { git = "https://github.com/ucb-substrate/substrate", branch = "main" }
sky130_open_pdk = { git = "https://github.com/ucb-substrate/substrate", branch = "main" }
ngspice = { git = "https://github.com/ucb-substrate/substrate", branch = "main" }
rust_decimal = "1"
rust_decimal_macros = "1"

[dev-dependencies]
paste = "1"

[[test]]
name = "portable_outputs"
path = "src/cli/tests.rs"

[features]
default = []
